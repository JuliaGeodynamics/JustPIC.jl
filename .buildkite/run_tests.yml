steps:
  - label: "CUDA Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia --project=. -e 'println("--- :julia: Instantiating project")
                using Pkg
                Pkg.instantiate()' || exit 3

      julia --project=. -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test(; test_args=["--backend=CUDA"], coverage=true)'
    agents:
      queue: "cuda"
    timeout_in_minutes: 120
    soft_fail:
      - exit_status: 3
    env:
      JULIA_NUM_THREADS: 4

  - label: "AMDGPU Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia --project=. -e 'println("--- :julia: Instantiating project")
                using Pkg
                Pkg.instantiate()' || exit 3

      julia --project=. -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test(; test_args=["--backend=AMDGPU"], coverage=true)'
    agents:
      queue: "rocm"
      rocmgpu: "*"
    timeout_in_minutes: 120
    soft_fail:
      - exit_status: 3
    env:
      JULIA_NUM_THREADS: 4

  - label: "Metal Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia --project=. -e 'println("--- :julia: Instantiating project")
                using Pkg
                Pkg.instantiate()' || exit 3

      julia --project=. -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test(; test_args=["--backend=Metal"], coverage=true)'
    agents:
      queue: "metal"
    timeout_in_minutes: 120
    soft_fail:
      - exit_status: 3
    env:
      JULIA_NUM_THREADS: 4
  - label: ":stopwatch: Benchmarks CUDA"
    key: "benchmarks-cuda"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
    command: |
      echo "--- :julia: Instantiating benchmark environment"
      julia --project=benchmarking benchmarking/setup.jl

      echo "+++ :stopwatch: CUDA benchmarks"
      julia --project=benchmarking benchmarking/run_benchmarks.jl --backend=CUDA --output=benchmark_results_CUDA.json

      echo "+++ :stopwatch: host CPU benchmarks"
      julia --project=benchmarking benchmarking/run_benchmarks.jl --backend=CPU --output=benchmark_results_CUDA-host-CPU.json
    artifact_paths:
      - "benchmark_results_*.json"
    agents:
      queue: "cuda"
    timeout_in_minutes: 60
    env:
      JULIA_NUM_THREADS: 4
      JULIA_PKG_PRECOMPILE_AUTO: 0

  - label: ":stopwatch: Benchmarks AMDGPU"
    key: "benchmarks-amdgpu"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
    command: |
      echo "--- :julia: Instantiating benchmark environment"
      julia --project=benchmarking benchmarking/setup.jl

      echo "+++ :stopwatch: AMDGPU benchmarks"
      julia --project=benchmarking benchmarking/run_benchmarks.jl --backend=AMDGPU --output=benchmark_results_AMDGPU.json
    artifact_paths:
      - "benchmark_results_*.json"
    agents:
      queue: "rocm"
      rocmgpu: "*"
    timeout_in_minutes: 60
    env:
      JULIA_NUM_THREADS: 4
      JULIA_PKG_PRECOMPILE_AUTO: 0

  - label: ":stopwatch: Benchmarks Metal"
    key: "benchmarks-metal"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
    command: |
      echo "--- :julia: Instantiating benchmark environment"
      julia --project=benchmarking benchmarking/setup.jl

      echo "+++ :stopwatch: Metal benchmarks"
      julia --project=benchmarking benchmarking/run_benchmarks.jl --backend=Metal --output=benchmark_results_Metal.json

      echo "+++ :stopwatch: host CPU benchmarks"
      julia --project=benchmarking benchmarking/run_benchmarks.jl --backend=CPU --output=benchmark_results_Metal-host-CPU.json
    artifact_paths:
      - "benchmark_results_*.json"
    agents:
      queue: "metal"
    timeout_in_minutes: 60
    env:
      JULIA_NUM_THREADS: 4
      JULIA_PKG_PRECOMPILE_AUTO: 0

